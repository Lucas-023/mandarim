# Publica o app estático no GitHub Pages.
# Os seus dados NÃO vão para cá: a pasta data/ fica de fora da publicação.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar os testes
        run: npm test
      - name: Montar a pasta de publicação
        run: node scripts/preparar-publicacao.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicar
      - id: deploy
        uses: actions/deploy-pages@v4
